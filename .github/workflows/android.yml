name: NEXORA Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Código-Fonte
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Conceder permissão de execução ao Gradle
      run: chmod +x gradlew || true

    - name: Executar Testes Unitários e Robolectric
      run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

    - name: Guardar relatório dos testes
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nexora-relatorio-testes
        path: app/build/reports/tests/testDebugUnitTest/
        if-no-files-found: warn

    - name: Compilar APK Debug
      run: gradle :app:assembleDebug --no-daemon

    - name: Upload Artifact APK Debug
      uses: actions/upload-artifact@v4
      with:
        name: nexora-app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
